<template>
  <style>
    @font-face { font-family: "CapFont"; src: url("assets/fonts/InterDisplay-Black.otf"); font-weight: 900; }
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #cap { position: absolute; left: 70px; right: 70px; top: 1110px; text-align: center; font-family: "CapFont", sans-serif; font-weight: 900;
      font-size: 98px; line-height: 1.06; letter-spacing: -1px; text-transform: uppercase; color: #ffffff; }
    #cap .w { display: inline-block; margin: 0 0.12em; -webkit-text-stroke: 16px #0b0b10; paint-order: stroke fill;
      text-shadow: 0 9px 0 rgba(0, 0, 0, 0.55); transform-origin: 50% 70%; }
    #cap .w.on { color: #ff4fd8; }
    #cap.voice .w.on { color: #ffe14d; }
  </style>
  <div id="root" data-composition-id="caps" data-width="1080" data-height="1920">
    <div id="cap" data-layout-allow-overflow></div>
  </div>
  <script>
    (function () {
      // Karaoke captions from the narration's word times: 1-3 words a group, the spoken word lights up.
      const W = (window.CUES && window.CUES.words) || [], END = (window.CUES && window.CUES.END) || 1;
      // a character's line (story.json "speaker") gets its own colour; story.json "captionMerge" shows spoken numbers as digits,
      // e.g. [["nineteen eighty", "1980"], ["one hundred", "100"]]
      const VOICE = new Set(((window.CUES && window.CUES.takes) || []).filter((t) => t.speaker).map((t) => t.pid));
      const MERGE = (((window.STORY && window.STORY.captionMerge) || [])).map(([a, b]) => [a.toLowerCase().split(/\s+/), b]);
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9']/g, "");
      const toks = [];
      for (let i = 0; i < W.length; i++) {
        let hit = null;
        for (const [seq, out] of MERGE) if (seq.every((s, j) => W[i + j] && norm(W[i + j][2]) === s)) hit = [seq.length, out];
        if (hit) { const last = W[i + hit[0] - 1]; toks.push({ s: W[i][0], e: last[1], t: hit[1] + last[2].replace(/[a-z0-9']+/gi, ""), take: W[i][3] }); i += hit[0] - 1; }
        else toks.push({ s: W[i][0], e: W[i][1], t: W[i][2], take: W[i][3] });
      }
      const groups = [];
      let cur = [];
      toks.forEach((tk, i) => {
        cur.push(tk);
        const chars = cur.map((x) => x.t).join(" ").length;
        const next = toks[i + 1];
        const stop = /[.?!:]$/.test(tk.t) || (/,$/.test(tk.t) && cur.length >= 2) || cur.length >= 3 || chars >= 15 || !next || next.take !== tk.take || (next && next.s - tk.e > 0.45);
        if (stop) { groups.push(cur); cur = []; }
      });
      groups.forEach((g, i) => { g.a = g[0].s - 0.06; const nx = groups[i + 1]; g.b = Math.min(nx ? nx[0].s - 0.06 : END, g[g.length - 1].e + 0.55); });
      const cap = document.getElementById("cap");
      let shown = -1;
      function draw(t) {
        let gi = -1;
        for (let i = 0; i < groups.length; i++) if (t >= groups[i].a && t < groups[i].b) { gi = i; break; }
        if (gi !== shown) {
          shown = gi;
          if (gi < 0) cap.innerHTML = "";
          else { const g = groups[gi]; cap.className = VOICE.has(g[0].take) ? "voice" : ""; cap.innerHTML = g.map((x) => `<span class="w">${x.t.replace(/[,.:]$/, "")}</span>`).join(" "); }
        }
        if (gi < 0) return;
        const g = groups[gi], spans = cap.children;
        const k = Math.min(1, (t - g.a) / 0.09), pop = 0.86 + 0.14 * (1 - Math.pow(1 - k, 3));
        cap.style.transform = `scale(${pop.toFixed(4)})`;
        for (let j = 0; j < g.length; j++) {
          const on = t >= g[j].s - 0.03 && (j === g.length - 1 || t < g[j + 1].s - 0.03);
          spans[j].classList.toggle("on", on);
          const kk = Math.min(1, Math.max(0, (t - g[j].s + 0.03) / 0.08));
          spans[j].style.transform = on ? `scale(${(1 + 0.1 * Math.sin(Math.PI * kk)).toFixed(4)})` : "none";
        }
      }
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => draw(st.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["caps"] = tl;
    })();
  </script>
</template>
